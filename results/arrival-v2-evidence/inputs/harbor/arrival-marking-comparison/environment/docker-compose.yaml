  redis:
    image: redis@sha256:43c5c111b5b63afce26faea67198f8cf7e63b941460bcfe1525b68a6ad1eef92
    networks: [lab]
    command: [redis-server, --save, "", --appendonly, "yes", --appendfsync, always]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
networks:
  lab:
    internal: true
